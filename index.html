<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구역 회의록 작성</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background-color: #f4f6f9; }
        .step { display: none; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .active { display: block; }
        h2 { border-bottom: 2px solid #0088cc; padding-bottom: 10px; color: #333; }
        label { font-weight: bold; margin-top: 10px; display: block; }
        input[type="text"], input[type="date"], select, textarea { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .member-row { background: #f9f9f9; padding: 10px; margin-bottom: 10px; border-left: 4px solid #0088cc; border-radius: 4px; }
        .member-header { font-weight: bold; margin-bottom: 5px; font-size: 1.1em; }
        .evan-inputs { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        .evan-inputs label { margin: 0; width: 30px; }
        button { width: 100%; padding: 12px; margin-top: 10px; border: none; background: #0088cc; color: white; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button.secondary { background: #6c757d; }
        .checkbox-container { display: flex; align-items: center; margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 5px; }
        .checkbox-container input { width: 20px; height: 20px; margin-right: 10px; }
        .org-section { margin-top: 20px; padding-top: 15px; border-top: 2px dashed #ccc; }
    </style>
</head>
<body>

<!-- 1단계 -->
<div id="step1" class="step active">
    <h2>1. 회의 기본 정보</h2>
    <label>구역 선택</label>
    <select id="zone">
        <option value="">선택하세요</option>
        <option value="1">1구역</option><option value="2">2구역</option><option value="3">3구역</option>
        <option value="4">4구역</option><option value="5">5구역</option><option value="6">6구역</option>
        <option value="7">7구역</option><option value="8">8구역</option><option value="9">9구역</option><option value="10">10구역</option>
    </select>
    <label>일시</label><input type="date" id="date">
    <label>장소</label><input type="text" id="location" placeholder="예: 교회, 카페 이름 등">
    <label>참여자 (이름)</label><input type="text" id="participants" placeholder="예: 홍길동, 김철수">
    <button onclick="nextStep(1, 2)">다음으로</button>
</div>

<!-- 2단계 -->
<div id="step2" class="step">
    <h2>2. 회의 내용 (심방/예배)</h2>
    <div id="worship-list"></div>
    <div class="org-section">
        <label>[조직] 구역 예배 및 심방 피드백</label>
        <textarea id="org_worship_fb" rows="3" placeholder="구역 전체 예배 및 심방 관련 피드백 작성"></textarea>
    </div>
    <button class="secondary" onclick="goToStep(1)">이전으로</button>
    <button onclick="goToStep(3)">다음으로</button>
</div>

<!-- 3단계 -->
<div id="step3" class="step">
    <h2>3. 회의 내용 (전도 현황)</h2>
    <div id="evangelism-list"></div>
    <div class="org-section">
        <label>[조직] 구역 전도 현황 피드백</label>
        <textarea id="org_evan_fb" rows="3" placeholder="구역 전체 전도 현황 관련 피드백 작성"></textarea>
    </div>
    <button class="secondary" onclick="goToStep(2)">이전으로</button>
    <button onclick="goToStep(4)">다음으로</button>
</div>

<!-- 4단계 (추가됨) -->
<div id="step4" class="step">
    <h2>4. 기타 회의 내용</h2>
    <label>기타 안건 및 자유 기입</label>
    <textarea id="other_details" rows="5" placeholder="기타 회의 내용 자유롭게 작성"></textarea>
    <button class="secondary" onclick="goToStep(3)">이전으로</button>
    <button onclick="goToStep(5)">다음으로</button>
</div>

<!-- 5단계 -->
<div id="step5" class="step">
    <h2>5. 후보고 사진 및 확인</h2>
    <label>회의/모임 사진 첨부</label>
    <input type="file" id="meeting_photo" accept="image/*">
    <div class="checkbox-container">
        <input type="checkbox" id="confirm_meeting">
        <label for="confirm_meeting">구역장과 부구역장이 모여 회의를 했음을 확인합니다.</label>
    </div>
    <button class="secondary" onclick="goToStep(4)">이전으로</button>
    <button onclick="submitData()" style="background: #28a745;">결과 보고</button>
</div>

<script>
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();

    const SERVER_URL = "https://ssl-render-directories-ratios.trycloudflare.com"; // ★ 터널 주소 입력

    let currentMembers = [];

    function countNames(str) {
        if (!str) return 0;
        return str.split(/[ ,]+/).filter(n => n.trim() !== "").length;
    }

    function updateEvanCount(idx) {
        const total = countNames(document.getElementById(`evan_in_${idx}`).value) + 
                      countNames(document.getElementById(`evan_kyo_${idx}`).value) + 
                      countNames(document.getElementById(`evan_sum_${idx}`).value);
        document.getElementById(`evan_total_${idx}`).innerText = total;
    }

    async function nextStep(current, next) {
        // 1페이지 필수 입력 검증
        if (current === 1 && next === 2) {
            const z = document.getElementById('zone').value;
            if (!z || !document.getElementById('date').value || !document.getElementById('location').value || !document.getElementById('participants').value) {
                alert("구역선택, 일시, 장소, 참여자를 모두 기입해야 다음으로 넘어갈 수 있습니다.");
                return;
            }
            try {
                const response = await fetch(`${SERVER_URL}/api/get-data/${z}`);
                if (!response.ok) throw new Error("서버 에러");
                currentMembers = await response.json();
                renderLists();
            } catch (error) {
                alert('명단 로딩 실패: ' + error.message);
                return;
            }
        }
        goToStep(next);
    }

    function goToStep(step) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('step' + step).classList.add('active');
    }

    function renderLists() {
        let worshipHtml = '', evanHtml = '';
        currentMembers.forEach((m, idx) => {
            worshipHtml += `
            <div class="member-row">
                <div class="member-header">${m.name}</div>
                <input type="text" id="visit_${idx}" placeholder="심방(신앙관리) 피드백 기입">
                <input type="text" id="worship_${idx}" placeholder="예배 피드백 기입">
            </div>`;
            
            const totalEvan = countNames(m.in_names) + countNames(m.kyo_names) + countNames(m.sum_names);
            evanHtml += `
            <div class="member-row">
                <div class="member-header">${m.name} (전도 인원: <span id="evan_total_${idx}">${totalEvan}</span>명)</div>
                <div class="evan-inputs"><label>인:</label><input type="text" id="evan_in_${idx}" value="${m.in_names}"></div>
                <div class="evan-inputs"><label>교:</label><input type="text" id="evan_kyo_${idx}" value="${m.kyo_names}"></div>
                <div class="evan-inputs"><label>섬:</label><input type="text" id="evan_sum_${idx}" value="${m.sum_names}"></div>
                <input type="text" id="evan_fb_${idx}" placeholder="특이사항/피드백 기입">
            </div>`;
        });
        document.getElementById('worship-list').innerHTML = worshipHtml;
        document.getElementById('evangelism-list').innerHTML = evanHtml;
    }

    async function submitData() {
        if (!document.getElementById('confirm_meeting').checked) {
            alert("회의 확인 체크박스를 체크해야만 결과보고를 할 수 있습니다.");
            return;
        }

        const formData = new FormData();
        const zone = document.getElementById('zone').value;
        formData.append('zone', zone);
        
        // 텔레그램 앱 내에서 실행한 개인 또는 그룹의 고유 채팅 ID 확보
        const chatId = window.Telegram.WebApp.initDataUnsafe?.chat?.id || window.Telegram.WebApp.initDataUnsafe?.user?.id || "";
        formData.append('chat_id', chatId);
        
        const photoFile = document.getElementById('meeting_photo').files[0];
        if (photoFile) formData.append('photo', photoFile);

        // 보고서 텍스트 생성
        let report = `📋 [${zone}구역 주간 회의 보고]\n`;
        report += `📅 일시: ${document.getElementById('date').value}\n📍 장소: ${document.getElementById('location').value}\n👥 참여자: ${document.getElementById('participants').value}\n\n`;
        
        report += `[심방 및 예배]\n`;
        currentMembers.forEach((m, idx) => {
            const v = document.getElementById(`visit_${idx}`).value, w = document.getElementById(`worship_${idx}`).value;
            if (v || w) report += `▫️ ${m.name}\n${v ? ' - 심방: '+v+'\n' : ''}${w ? ' - 예배: '+w+'\n' : ''}`;
        });
        const orgWorship = document.getElementById('org_worship_fb').value;
        if (orgWorship) report += `▶ 조직 피드백: ${orgWorship}\n`;

        report += `\n[전도 현황]\n`;
        const membersData = [];
        currentMembers.forEach((m, idx) => {
            const e_in = document.getElementById(`evan_in_${idx}`).value, e_kyo = document.getElementById(`evan_kyo_${idx}`).value, e_sum = document.getElementById(`evan_sum_${idx}`).value;
            const e_fb = document.getElementById(`evan_fb_${idx}`).value, total = document.getElementById(`evan_total_${idx}`).innerText;
            membersData.push({name: m.name, in: e_in, kyo: e_kyo, sum: e_sum});
            if (e_in || e_kyo || e_sum || e_fb) {
                report += `▫️ ${m.name} (누적 ${total}명)\n${e_in ? ' - 인: '+e_in+'\n' : ''}${e_kyo ? ' - 교: '+e_kyo+'\n' : ''}${e_sum ? ' - 섬: '+e_sum+'\n' : ''}${e_fb ? ' - 피드백: '+e_fb+'\n' : ''}`;
            }
        });
        const orgEvan = document.getElementById('org_evan_fb').value;
        if (orgEvan) report += `▶ 조직 피드백: ${orgEvan}\n`;

        const otherDetails = document.getElementById('other_details').value;
        if (otherDetails) report += `\n[기타 회의 내용]\n${otherDetails}\n`;

        formData.append('report_text', report);
        formData.append('members_data', JSON.stringify(membersData));

        try {
            const response = await fetch(`${SERVER_URL}/api/submit`, { method: 'POST', body: formData });
            if (response.ok) {
                alert('구역 회의록이 정상적으로 보고 되었습니다.');
                
                // 제출 성공 시 모든 입력값 초기화
                document.querySelectorAll('input, textarea, select').forEach(el => {
                    if (el.type === 'checkbox') el.checked = false;
                    else el.value = '';
                });
                
                // 첫 페이지로 이동
                goToStep(1);
                
                // 최상단으로 스크롤 이동
                window.scrollTo(0, 0); 
            } else {
                alert('저장 실패: ' + response.status);
            }
        } catch (error) {
            alert('데이터 전송 오류: ' + error.message);
        }
    }
</script>
</body>
</html>
