<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회의록 작성</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 15px; background-color: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
        .step { display: none; }
        .active { display: block; }
        input[type="text"], input[type="date"], select, textarea { width: 100%; margin-bottom: 15px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 12px; background-color: var(--tg-theme-button-color, #3390ec); color: var(--tg-theme-button-text-color, #fff); border: none; border-radius: 5px; margin-bottom: 8px; font-weight: bold; cursor: pointer; }
        
        .section-title { font-size: 16px; font-weight: bold; margin-top: 20px; margin-bottom: 10px; color: var(--tg-theme-button-color, #3390ec); border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .member-row { display: flex; flex-direction: column; margin-bottom: 15px; padding: 10px; background: #f9f9f9; border-radius: 5px; border: 1px solid #eee; color: #333; }
        .member-header { display: flex; align-items: center; font-weight: bold; margin-bottom: 5px; }
        .member-header input[type="checkbox"] { width: auto; margin-right: 10px; transform: scale(1.2); }
        .member-row input, .member-row textarea { margin-bottom: 0; margin-top: 5px; }
        .badge { font-size: 12px; background: #e0e0e0; padding: 2px 6px; border-radius: 10px; margin-left: auto; }
    </style>
</head>
<body>

<!-- [1단계] -->
<div id="step1" class="step active">
    <h2>기본 내용 기입</h2>
    <label>구역 선택</label>
    <select id="zone">
        <option value="1">1구역</option>
        <option value="2">2구역</option>
    </select>
    
    <label>일시</label>
    <input type="date" id="date">
    
    <label>장소</label>
    <input type="text" id="location" placeholder="직접 기입">
    
    <label>참여자(이름)</label>
    <input type="text" id="participants" placeholder="직접 기입 (예: 홍길동, 김철수)">
    
    <button onclick="goToStep(2)">다음으로 (명단 불러오기)</button>
</div>

<!-- [2단계] -->
<div id="step2" class="step">
    <h2>회의 내용 (심방/예배)</h2>
    
    <div class="section-title">- 심방(신앙관리)</div>
    <div id="visit-list"></div> <!-- 명단 동적 생성 영역 -->

    <div class="section-title">- 예배</div>
    <b>[개인]</b> 특이사항 인원 선택
    <div id="worship-list"></div> <!-- 명단 동적 생성 영역 -->
    
    <br><b>[조직]</b> 구역 예배 피드백
    <textarea id="worship-org" rows="3" placeholder="구역 자체 예배 피드백 내용"></textarea>
    
    <button onclick="goToStep(1)">이전으로</button>
    <button onclick="goToStep(3)">다음으로</button>
</div>

<!-- [3단계] -->
<div id="step3" class="step">
    <h2>회의 내용 (전도/교육/헌금)</h2>
    
    <div class="section-title">- 전도</div>
    <b>[개인]</b> 올해 현황 및 피드백
    <div id="evangelism-list"></div>
    
    <br><b>[조직]</b> 구역 전도 피드백
    <textarea id="evangelism-org" rows="3" placeholder="구역 자체 전도 피드백 내용"></textarea>

    <div class="section-title">- 교육</div>
    <b>[개인]</b> 교육 피드백
    <div id="edu-list"></div>

    <div class="section-title">- 헌금</div>
    <b>[개인]</b> 예정일자 및 피드백
    <div id="offering-list"></div>
    
    <button onclick="goToStep(2)">이전으로</button>
    <button onclick="submitData()">회의록 완성 (봇으로 전송)</button>
</div>

<script>
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();

    // 임시 DB 데이터 (추후 파이썬 서버 연동 시 대체)
    const mockDB = {
        "1": [{name: "홍길동", evanCount: 2, offeringDate: "2026-09-25"}, {name: "김철수", evanCount: 0, offeringDate: ""}],
        "2": [{name: "이영희", evanCount: 1, offeringDate: "2026-10-01"}, {name: "박민수", evanCount: 5, offeringDate: ""}]
    };

    function goToStep(step) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('step' + step).classList.add('active');

        // 1단계에서 2단계로 넘어갈 때 선택된 구역 명단을 화면에 그림
        if(step === 2) {
            renderLists();
        }
    }

    function renderLists() {
        const zone = document.getElementById('zone').value;
        const members = mockDB[zone] || [];
        
        let visitHtml = '', worshipHtml = '', evanHtml = '', eduHtml = '', offeringHtml = '';

        members.forEach((m, idx) => {
            // 심방: 전원 리스트업, 특이사항 기입
            visitHtml += `<div class="member-row">
                <div class="member-header">${m.name}</div>
                <input type="text" id="visit_${idx}" placeholder="${m.name} 특이사항 기입">
            </div>`;

            // 예배: 체크박스로 선택 및 피드백
            worshipHtml += `<div class="member-row">
                <div class="member-header"><input type="checkbox" id="chk_worship_${idx}"> ${m.name}</div>
                <input type="text" id="worship_${idx}" placeholder="피드백 내용 기입">
            </div>`;

            // 전도: 전도 현황 표시 및 피드백
            evanHtml += `<div class="member-row">
                <div class="member-header">${m.name} <span class="badge">올해 전도: ${m.evanCount}명</span></div>
                <input type="text" id="evan_${idx}" placeholder="특이사항 및 피드백 기입">
            </div>`;

            // 교육: 피드백 기입
            eduHtml += `<div class="member-row">
                <div class="member-header">${m.name}</div>
                <input type="text" id="edu_${idx}" placeholder="교육 피드백 기입">
            </div>`;

            // 헌금: 예정일자 및 피드백 (기존 예정일자가 있으면 밸류에 삽입)
            offeringHtml += `<div class="member-row">
                <div class="member-header">${m.name}</div>
                <label style="font-size:12px;">헌금 예정일</label>
                <input type="date" id="offering_date_${idx}" value="${m.offeringDate}">
                <input type="text" id="offering_fb_${idx}" placeholder="피드백 기입">
            </div>`;
        });

        document.getElementById('visit-list').innerHTML = visitHtml;
        document.getElementById('worship-list').innerHTML = worshipHtml;
        document.getElementById('evangelism-list').innerHTML = evanHtml;
        document.getElementById('edu-list').innerHTML = eduHtml;
        document.getElementById('offering-list').innerHTML = offeringHtml;
    }

    function submitData() {
        alert('작성 완료! 텔레그램으로 전송합니다. (서버 연결 시 작동)');
        window.Telegram.WebApp.close();
    }
</script>
</body>
</html>
